<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="840" height="310" role="img" aria-labelledby="t d">
  <title id="t">The gated MLP and where SwiGLU sits</title>
  <desc id="d">x of shape M by D goes through two GEMMs, x times W_gate and x times W_up, giving gate and up, each M by F. SwiGLU applies SiLU to gate and multiplies by up to give h, M by F. A third GEMM, h times W_down, gives the M by D output. The GEMMs do almost all the FLOPs; SwiGLU does about 5 FLOPs per element but touches three M by F tensors.</desc>
  <style>
    /* Granite tokens (light, then dark) */
    svg { --background:oklch(0.97 0.005 106); --card:oklch(1 0.005 106);
          --border:oklch(0.9 0.005 106); --foreground:oklch(0.24 0.005 106); --ink-2:oklch(0.42 0.005 106);
          --muted-foreground:oklch(0.5 0.005 106); --brand:oklch(0.46 0.032 240); --brand-muted:oklch(0.935 0.0096 240);
          --chart-2:oklch(0.82 0.04 244.9); --chart-3:oklch(0.79 0.045 152.8); --chart-4:oklch(0.79 0.06 53.3);
          --on-fill:oklch(1 0.005 106); }
    @media (prefers-color-scheme: dark) {
      svg { --background:oklch(0.208 0.013 86); --card:oklch(0.24 0.013 86);
            --border:oklch(0.94 0.013 86 / 12%); --foreground:oklch(0.94 0.013 86); --ink-2:oklch(0.8 0.013 86);
            --muted-foreground:oklch(0.94 0.013 86 / 60%); --brand:oklch(0.78 0.035 240); --brand-muted:oklch(0.3 0.014 240);
            --chart-2:oklch(0.46 0.05 252.8); --chart-3:oklch(0.5 0.055 151); --chart-4:oklch(0.52 0.065 46.8);
            --on-fill:oklch(0.208 0.013 86); }
    }
    text { font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size:14px; fill:var(--foreground); }
    .frame { fill:var(--background); stroke:var(--border); }
    .title { font-size:15px; font-weight:500; }
    .meta { font-size:12px; fill:var(--muted-foreground); }
    .mono, .mono text { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
    .eyebrow { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:11px; font-weight:500; letter-spacing:.12em; fill:var(--muted-foreground); }
    .axis { fill:none; stroke:var(--muted-foreground); marker-end:url(#tip); }
    .tensor { fill:var(--card); stroke:var(--border); stroke-width:1.5; }
    .g { fill:var(--chart-2); }
    .u { fill:var(--chart-4); }
    .h { fill:var(--chart-3); }
    .op { fill:var(--foreground); }
    .on { fill:var(--on-fill); font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px; font-weight:500; }
    .x-mark { stroke:var(--on-fill); stroke-width:2; stroke-linecap:round; }
    .focus { fill:var(--brand-muted); stroke:var(--brand); stroke-width:1.5; }
    .dim { font-weight:500; }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9" style="fill:none; stroke:var(--muted-foreground); stroke-width:1.5"/>
    </marker>
  </defs>
  <rect class="frame" x="0.5" y="0.5" width="839" height="309" rx="16"/>

  <text class="eyebrow" x="24" y="38">GATED MLP · ONE LAYER</text>
  <text class="eyebrow" x="356" y="38">SWIGLU · THIS EXERCISE</text>

  <!-- SwiGLU region -->
  <rect class="focus" x="356" y="54" width="164" height="196" rx="6"/>

  <!-- x -->
  <rect class="tensor" x="24" y="128" width="70" height="48" rx="2"/>
  <text class="dim" x="59" y="148" text-anchor="middle">x</text>
  <text class="mono" x="59" y="166" text-anchor="middle">[M, D]</text>

  <!-- branches -->
  <path class="axis" d="M94,152 H108 V96 H122"/>
  <path class="axis" d="M108,152 V208 H122"/>

  <!-- GEMMs -->
  <rect class="op" x="124" y="74" width="100" height="44" rx="6"/>
  <text class="on" x="174" y="101" text-anchor="middle">x @ W_gate</text>
  <rect class="op" x="124" y="186" width="100" height="44" rx="6"/>
  <text class="on" x="174" y="213" text-anchor="middle">x @ W_up</text>
  <path class="axis" d="M224,96 H250"/>
  <path class="axis" d="M224,208 H250"/>

  <!-- gate / up -->
  <rect class="g" x="252" y="72" width="80" height="48" rx="2"/>
  <text class="dim" x="292" y="92" text-anchor="middle">gate</text>
  <text class="mono" x="292" y="110" text-anchor="middle">[M, F]</text>
  <rect class="u" x="252" y="184" width="80" height="48" rx="2"/>
  <text class="dim" x="292" y="204" text-anchor="middle">up</text>
  <text class="mono" x="292" y="222" text-anchor="middle">[M, F]</text>

  <!-- SiLU and multiply -->
  <path class="axis" d="M332,96 H370"/>
  <rect class="op" x="372" y="74" width="64" height="44" rx="6"/>
  <text class="on" x="404" y="101" text-anchor="middle">SiLU</text>
  <path class="axis" d="M436,96 H480 V132"/>
  <path class="axis" d="M332,208 H480 V172"/>
  <circle class="op" cx="480" cy="152" r="18"/>
  <path class="x-mark" d="M474,146 L486,158 M486,146 L474,158"/>

  <!-- h, down, out -->
  <path class="axis" d="M498,152 H544"/>
  <rect class="h" x="546" y="128" width="70" height="48" rx="2"/>
  <text class="dim" x="581" y="148" text-anchor="middle">h</text>
  <text class="mono" x="581" y="166" text-anchor="middle">[M, F]</text>
  <path class="axis" d="M616,152 H638"/>
  <rect class="op" x="640" y="130" width="100" height="44" rx="6"/>
  <text class="on" x="690" y="157" text-anchor="middle">h @ W_down</text>
  <path class="axis" d="M740,152 H758"/>
  <rect class="tensor" x="760" y="128" width="56" height="48" rx="2"/>
  <text class="dim" x="788" y="148" text-anchor="middle">out</text>
  <text class="mono" x="788" y="166" text-anchor="middle">[M, D]</text>

  <!-- notes -->
  <text class="meta" x="124" y="256">GEMMs: almost all the FLOPs</text>
  <text class="meta" x="356" y="274">about 5 FLOPs per element,</text>
  <text class="meta" x="356" y="292">but 3 [M, F] tensors of traffic</text>
  <text class="meta" x="640" y="200">GEMM</text>
  <text class="meta" x="560" y="274">D = 4096, F = 14336</text>
  <text class="meta" x="560" y="292">(Llama-3-8B), M = tokens</text>
</svg>
