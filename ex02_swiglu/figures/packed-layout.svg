<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520" role="img" aria-labelledby="t d">
  <title id="t">The packed gate and up layout</title>
  <desc id="d">gu has shape M by 2F. Columns 0 to F-1 of each row are gate and columns F to 2F-1 are up, so one row of gu is 2F elements long and stride_gu_row is 2F. In memory the buffer alternates row 0 gate, row 0 up, row 1 gate, row 1 up, and so on. The output out has shape M by F with row stride F. The example uses M = 3 and F = 4. gate[1, 1] and out[1, 1] are highlighted; the figure leaves the flat offsets as a question.</desc>
  <style>
    /* Granite tokens (light, then dark) */
    svg { --background:oklch(0.97 0.005 106);
          --border:oklch(0.9 0.005 106); --foreground:oklch(0.24 0.005 106); --ink-2:oklch(0.42 0.005 106);
          --muted-foreground:oklch(0.5 0.005 106); --brand:oklch(0.46 0.032 240);
          --chart-2:oklch(0.82 0.04 244.9); --chart-3:oklch(0.79 0.045 152.8); --chart-4:oklch(0.79 0.06 53.3); }
    @media (prefers-color-scheme: dark) {
      svg { --background:oklch(0.208 0.013 86);
            --border:oklch(0.94 0.013 86 / 12%); --foreground:oklch(0.94 0.013 86); --ink-2:oklch(0.8 0.013 86);
            --muted-foreground:oklch(0.94 0.013 86 / 60%); --brand:oklch(0.78 0.035 240);
            --chart-2:oklch(0.46 0.05 252.8); --chart-3:oklch(0.5 0.055 151); --chart-4:oklch(0.52 0.065 46.8); }
    }
    text { font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size:14px; fill:var(--foreground); }
    .frame { fill:var(--background); stroke:var(--border); }
    .title { font-size:15px; font-weight:500; }
    .ink-2 { fill:var(--ink-2); }
    .meta, .meta text { font-size:12px; fill:var(--muted-foreground); }
    .mono, .mono text { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px; }
    .eyebrow { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:11px; font-weight:500; letter-spacing:.12em; fill:var(--muted-foreground); }
    .cell { stroke:var(--background); stroke-width:2; }
    .g { fill:var(--chart-2); }
    .g-hot { fill:var(--brand); }
    .u { fill:var(--chart-4); }
    .o { fill:var(--chart-3); }
    .o-hot { fill:var(--foreground); }
    .bracket { fill:none; stroke:var(--muted-foreground); }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="839" height="519" rx="16"/>

  <!-- gu -->
  <text class="eyebrow" x="40" y="40">PACKED INPUT</text>
  <text class="title" x="60" y="66">gu</text>
  <text class="mono ink-2" x="84" y="66">[M, 2F]</text>
  <text x="132" y="100" text-anchor="middle">gate</text>
  <text x="276" y="100" text-anchor="middle">up</text>
  <g class="meta" text-anchor="middle"><text x="48" y="135">0</text><text x="48" y="171">1</text><text x="48" y="207">2</text></g>
  <rect class="cell g" x="60" y="112" width="36" height="36" rx="2"/>
    <rect class="cell g" x="96" y="112" width="36" height="36" rx="2"/>
    <rect class="cell g" x="132" y="112" width="36" height="36" rx="2"/>
    <rect class="cell g" x="168" y="112" width="36" height="36" rx="2"/>
    <rect class="cell u" x="204" y="112" width="36" height="36" rx="2"/>
    <rect class="cell u" x="240" y="112" width="36" height="36" rx="2"/>
    <rect class="cell u" x="276" y="112" width="36" height="36" rx="2"/>
    <rect class="cell u" x="312" y="112" width="36" height="36" rx="2"/>
    <rect class="cell g" x="60" y="148" width="36" height="36" rx="2"/>
    <rect class="cell g-hot" x="96" y="148" width="36" height="36" rx="2"/>
    <rect class="cell g" x="132" y="148" width="36" height="36" rx="2"/>
    <rect class="cell g" x="168" y="148" width="36" height="36" rx="2"/>
    <rect class="cell u" x="204" y="148" width="36" height="36" rx="2"/>
    <rect class="cell u" x="240" y="148" width="36" height="36" rx="2"/>
    <rect class="cell u" x="276" y="148" width="36" height="36" rx="2"/>
    <rect class="cell u" x="312" y="148" width="36" height="36" rx="2"/>
    <rect class="cell g" x="60" y="184" width="36" height="36" rx="2"/>
    <rect class="cell g" x="96" y="184" width="36" height="36" rx="2"/>
    <rect class="cell g" x="132" y="184" width="36" height="36" rx="2"/>
    <rect class="cell g" x="168" y="184" width="36" height="36" rx="2"/>
    <rect class="cell u" x="204" y="184" width="36" height="36" rx="2"/>
    <rect class="cell u" x="240" y="184" width="36" height="36" rx="2"/>
    <rect class="cell u" x="276" y="184" width="36" height="36" rx="2"/>
    <rect class="cell u" x="312" y="184" width="36" height="36" rx="2"/>
  <g class="meta" text-anchor="middle">
    <text x="78" y="240">0</text><text x="186" y="240">F-1</text>
    <text x="222" y="240">F</text><text x="330" y="240">2F-1</text>
  </g>
  <g class="mono ink-2" text-anchor="middle" style="font-size:12px">
    <text x="132" y="260" style="font-size:12px">gu[:, :F]</text><text x="276" y="260" style="font-size:12px">gu[:, F:]</text>
  </g>

  <!-- out -->
  <text class="eyebrow" x="420" y="40">OUTPUT</text>
  <text class="title" x="440" y="66">out</text>
  <text class="mono ink-2" x="472" y="66">[M, F]</text>
  <g class="meta" text-anchor="middle"><text x="428" y="135">0</text><text x="428" y="171">1</text><text x="428" y="207">2</text></g>
  <rect class="cell o" x="440" y="112" width="36" height="36" rx="2"/>
    <rect class="cell o" x="476" y="112" width="36" height="36" rx="2"/>
    <rect class="cell o" x="512" y="112" width="36" height="36" rx="2"/>
    <rect class="cell o" x="548" y="112" width="36" height="36" rx="2"/>
    <rect class="cell o" x="440" y="148" width="36" height="36" rx="2"/>
    <rect class="cell o-hot" x="476" y="148" width="36" height="36" rx="2"/>
    <rect class="cell o" x="512" y="148" width="36" height="36" rx="2"/>
    <rect class="cell o" x="548" y="148" width="36" height="36" rx="2"/>
    <rect class="cell o" x="440" y="184" width="36" height="36" rx="2"/>
    <rect class="cell o" x="476" y="184" width="36" height="36" rx="2"/>
    <rect class="cell o" x="512" y="184" width="36" height="36" rx="2"/>
    <rect class="cell o" x="548" y="184" width="36" height="36" rx="2"/>
  <g class="meta" text-anchor="middle"><text x="458" y="240">0</text><text x="566" y="240">F-1</text></g>

  <!-- legend and question -->
  <rect class="g-hot" x="630" y="112" width="14" height="14" rx="2"/>
  <text class="mono" x="654" y="124">gate[1, 1]</text>
  <rect class="o-hot" x="630" y="140" width="14" height="14" rx="2"/>
  <text class="mono" x="654" y="152">out[1, 1]</text>
  <text x="630" y="190">Work out on paper:</text>
  <text x="630" y="210">the flat offsets of</text>
  <text class="mono" x="630" y="232">gate[r, c], up[r, c]</text>
  <text x="630" y="252">and <tspan class="mono" style="font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px">out[r, c]</tspan></text>

  <!-- gu buffer -->
  <text class="eyebrow" x="40" y="300">GU IN MEMORY</text>
  <rect class="cell g" x="60" y="310" width="24" height="28" rx="2"/>
    <rect class="cell g" x="84" y="310" width="24" height="28" rx="2"/>
    <rect class="cell g" x="108" y="310" width="24" height="28" rx="2"/>
    <rect class="cell g" x="132" y="310" width="24" height="28" rx="2"/>
    <rect class="cell u" x="156" y="310" width="24" height="28" rx="2"/>
    <rect class="cell u" x="180" y="310" width="24" height="28" rx="2"/>
    <rect class="cell u" x="204" y="310" width="24" height="28" rx="2"/>
    <rect class="cell u" x="228" y="310" width="24" height="28" rx="2"/>
    <rect class="cell g" x="252" y="310" width="24" height="28" rx="2"/>
    <rect class="cell g-hot" x="276" y="310" width="24" height="28" rx="2"/>
    <rect class="cell g" x="300" y="310" width="24" height="28" rx="2"/>
    <rect class="cell g" x="324" y="310" width="24" height="28" rx="2"/>
    <rect class="cell u" x="348" y="310" width="24" height="28" rx="2"/>
    <rect class="cell u" x="372" y="310" width="24" height="28" rx="2"/>
    <rect class="cell u" x="396" y="310" width="24" height="28" rx="2"/>
    <rect class="cell u" x="420" y="310" width="24" height="28" rx="2"/>
    <rect class="cell g" x="444" y="310" width="24" height="28" rx="2"/>
    <rect class="cell g" x="468" y="310" width="24" height="28" rx="2"/>
    <rect class="cell g" x="492" y="310" width="24" height="28" rx="2"/>
    <rect class="cell g" x="516" y="310" width="24" height="28" rx="2"/>
    <rect class="cell u" x="540" y="310" width="24" height="28" rx="2"/>
    <rect class="cell u" x="564" y="310" width="24" height="28" rx="2"/>
    <rect class="cell u" x="588" y="310" width="24" height="28" rx="2"/>
    <rect class="cell u" x="612" y="310" width="24" height="28" rx="2"/>
  <text class="meta" x="644" y="329">...</text>
  <path class="bracket" d="M61,344 V350 H251 V344 M253,344 V350 H443 V344 M445,344 V350 H635 V344"/>
  <g class="meta" text-anchor="middle"><text x="156" y="366">row 0</text><text x="348" y="366">row 1</text><text x="540" y="366">row 2</text></g>
  <text class="mono" x="156" y="386" text-anchor="middle" style="font-size:12px">stride_gu_row = 2F</text>

  <!-- out buffer -->
  <text class="eyebrow" x="40" y="418">OUT IN MEMORY</text>
  <rect class="cell o" x="60" y="428" width="24" height="28" rx="2"/>
    <rect class="cell o" x="84" y="428" width="24" height="28" rx="2"/>
    <rect class="cell o" x="108" y="428" width="24" height="28" rx="2"/>
    <rect class="cell o" x="132" y="428" width="24" height="28" rx="2"/>
    <rect class="cell o" x="156" y="428" width="24" height="28" rx="2"/>
    <rect class="cell o-hot" x="180" y="428" width="24" height="28" rx="2"/>
    <rect class="cell o" x="204" y="428" width="24" height="28" rx="2"/>
    <rect class="cell o" x="228" y="428" width="24" height="28" rx="2"/>
    <rect class="cell o" x="252" y="428" width="24" height="28" rx="2"/>
    <rect class="cell o" x="276" y="428" width="24" height="28" rx="2"/>
    <rect class="cell o" x="300" y="428" width="24" height="28" rx="2"/>
    <rect class="cell o" x="324" y="428" width="24" height="28" rx="2"/>
  <text class="meta" x="356" y="447">...</text>
  <path class="bracket" d="M61,462 V468 H155 V462 M157,462 V468 H251 V462 M253,462 V468 H347 V462"/>
  <g class="meta" text-anchor="middle"><text x="108" y="484">row 0</text><text x="204" y="484">row 1</text><text x="300" y="484">row 2</text></g>
  <text class="mono" x="108" y="504" text-anchor="middle" style="font-size:12px">stride_out_row = F</text>
  <text class="meta" x="816" y="504" text-anchor="end">example: M = 3, F = 4</text>
</svg>
