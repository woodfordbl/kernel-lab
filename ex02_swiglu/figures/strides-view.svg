<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" role="img" aria-labelledby="t d">
  <title id="t">A 2-D tensor is a flat buffer plus strides</title>
  <desc id="d">A contiguous 3 by 4 tensor t holding a to l is stored row after row in a flat buffer at indices 0 to 11, so t.stride() is (4, 1). The view v = t[:, 1:3] selects b, c, f, g, j, k, at indices 1, 2, 5, 6, 9, 10: the same buffer with base offset 1, shape (3, 2) and strides (4, 1). One step down a row is 4 elements, so the rows of the view are not next to each other.</desc>
  <style>
    /* Granite tokens (light, then dark) */
    svg { --background:oklch(0.97 0.005 106); --card:oklch(1 0.005 106);
          --border:oklch(0.9 0.005 106); --foreground:oklch(0.24 0.005 106); --ink-2:oklch(0.42 0.005 106);
          --muted-foreground:oklch(0.5 0.005 106); --brand:oklch(0.46 0.032 240); --brand-muted:oklch(0.935 0.0096 240); }
    @media (prefers-color-scheme: dark) {
      svg { --background:oklch(0.208 0.013 86); --card:oklch(0.24 0.013 86);
            --border:oklch(0.94 0.013 86 / 12%); --foreground:oklch(0.94 0.013 86); --ink-2:oklch(0.8 0.013 86);
            --muted-foreground:oklch(0.94 0.013 86 / 60%); --brand:oklch(0.78 0.035 240); --brand-muted:oklch(0.3 0.014 240); }
    }
    text { font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size:14px; fill:var(--foreground); }
    .frame { fill:var(--background); stroke:var(--border); }
    .title { font-size:15px; font-weight:500; }
    .ink-2 { fill:var(--ink-2); }
    .meta, .meta text { font-size:12px; fill:var(--muted-foreground); }
    .mono, .mono text { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px; }
    .eyebrow { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:11px; font-weight:500; letter-spacing:.12em; fill:var(--muted-foreground); }
    .cell { fill:var(--card); stroke:var(--border); }
    .cell.hot { fill:var(--brand-muted); stroke:var(--brand); stroke-width:1.5; }
    .axis { fill:none; stroke:var(--muted-foreground); marker-end:url(#tip); }
    .bracket { fill:none; stroke:var(--muted-foreground); }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9" style="fill:none; stroke:var(--muted-foreground); stroke-width:1.5"/>
    </marker>
  </defs>
  <rect class="frame" x="0.5" y="0.5" width="839" height="339" rx="16"/>

  <!-- left: the 2-D picture -->
  <text class="eyebrow" x="40" y="40">AS A 2-D TENSOR</text>
  <text class="title" x="60" y="66">t</text>
  <text class="mono ink-2" x="74" y="66">[3, 4]</text>
  <g class="meta" text-anchor="middle"><text x="82" y="88">0</text><text x="126" y="88">1</text><text x="170" y="88">2</text><text x="214" y="88">3</text><text x="48" y="123">0</text><text x="48" y="167">1</text><text x="48" y="211">2</text></g>
  <g class="mono" text-anchor="middle">
    <rect class="cell" x="60" y="96" width="44" height="44" rx="2"/><text x="82" y="123">a</text>
    <rect class="cell hot" x="104" y="96" width="44" height="44" rx="2"/><text x="126" y="123">b</text>
    <rect class="cell hot" x="148" y="96" width="44" height="44" rx="2"/><text x="170" y="123">c</text>
    <rect class="cell" x="192" y="96" width="44" height="44" rx="2"/><text x="214" y="123">d</text>
    <rect class="cell" x="60" y="140" width="44" height="44" rx="2"/><text x="82" y="167">e</text>
    <rect class="cell hot" x="104" y="140" width="44" height="44" rx="2"/><text x="126" y="167">f</text>
    <rect class="cell hot" x="148" y="140" width="44" height="44" rx="2"/><text x="170" y="167">g</text>
    <rect class="cell" x="192" y="140" width="44" height="44" rx="2"/><text x="214" y="167">h</text>
    <rect class="cell" x="60" y="184" width="44" height="44" rx="2"/><text x="82" y="211">i</text>
    <rect class="cell hot" x="104" y="184" width="44" height="44" rx="2"/><text x="126" y="211">j</text>
    <rect class="cell hot" x="148" y="184" width="44" height="44" rx="2"/><text x="170" y="211">k</text>
    <rect class="cell" x="192" y="184" width="44" height="44" rx="2"/><text x="214" y="211">l</text>
  </g>

  <!-- right: the flat buffer -->
  <text class="eyebrow" x="300" y="40">IN MEMORY: ONE FLAT BUFFER</text>
  <path class="axis" d="M356,118 C356,80 514,80 514,116"/>
  <path class="axis" d="M526,118 C526,80 684,80 684,116"/>
  <text class="meta" x="435" y="80" text-anchor="middle">+4 (row stride)</text>
  <text class="meta" x="605" y="80" text-anchor="middle">+4</text>
  <g class="mono" text-anchor="middle">
    <rect class="cell" x="300" y="120" width="40" height="40" rx="2"/><text x="320" y="145">a</text>
    <rect class="cell hot" x="340" y="120" width="40" height="40" rx="2"/><text x="360" y="145">b</text>
    <rect class="cell hot" x="380" y="120" width="40" height="40" rx="2"/><text x="400" y="145">c</text>
    <rect class="cell" x="420" y="120" width="40" height="40" rx="2"/><text x="440" y="145">d</text>
    <rect class="cell" x="460" y="120" width="40" height="40" rx="2"/><text x="480" y="145">e</text>
    <rect class="cell hot" x="500" y="120" width="40" height="40" rx="2"/><text x="520" y="145">f</text>
    <rect class="cell hot" x="540" y="120" width="40" height="40" rx="2"/><text x="560" y="145">g</text>
    <rect class="cell" x="580" y="120" width="40" height="40" rx="2"/><text x="600" y="145">h</text>
    <rect class="cell" x="620" y="120" width="40" height="40" rx="2"/><text x="640" y="145">i</text>
    <rect class="cell hot" x="660" y="120" width="40" height="40" rx="2"/><text x="680" y="145">j</text>
    <rect class="cell hot" x="700" y="120" width="40" height="40" rx="2"/><text x="720" y="145">k</text>
    <rect class="cell" x="740" y="120" width="40" height="40" rx="2"/><text x="760" y="145">l</text>
  </g>
  <g class="meta" text-anchor="middle"><text x="320" y="178">0</text><text x="360" y="178">1</text><text x="400" y="178">2</text><text x="440" y="178">3</text><text x="480" y="178">4</text><text x="520" y="178">5</text><text x="560" y="178">6</text><text x="600" y="178">7</text><text x="640" y="178">8</text><text x="680" y="178">9</text><text x="720" y="178">10</text><text x="760" y="178">11</text></g>
  <path class="bracket" d="M302,188 V194 H458 V188 M462,188 V194 H618 V188 M622,188 V194 H778 V188"/>
  <g class="meta" text-anchor="middle"><text x="380" y="210">row 0</text><text x="540" y="210">row 1</text><text x="700" y="210">row 2</text></g>

  <!-- bottom: the rules -->
  <text class="mono" x="40" y="262">t.stride() == (4, 1)</text>
  <text class="mono" x="40" y="286">t[r, c] at  t_base + r * 4 + c * 1</text>
  <rect class="cell hot" x="420" y="250" width="14" height="14" rx="2"/>
  <text x="444" y="262">v = t[:, 1:3] is a view: same buffer, same strides</text>
  <text class="mono" x="444" y="286">v_base = t_base + 1,  shape (3, 2)</text>
  <text class="meta" x="444" y="312">Rows of v are not adjacent: d and e sit between rows 0 and 1.</text>
</svg>
