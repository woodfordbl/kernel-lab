<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" role="img" aria-labelledby="t d">
  <title id="t">How tl.sum reduces a row</title>
  <desc id="d">One program has 8 warps of 32 threads, each thread holding 16 elements. Step 0: each thread sums its own elements in registers. Step 1: within a warp, 5 rounds of shuffles with offsets 16, 8, 4, 2 and 1 halve the number of lanes holding partial sums until lane 0 holds the warp's sum. Step 2: each warp writes its sum to shared memory and one warp adds the 8 values. Step 3: the result is broadcast to all 256 threads.</desc>
