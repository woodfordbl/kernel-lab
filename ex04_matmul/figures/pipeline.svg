<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="t d">
  <title id="t">Software pipelining of the K loop</title>
  <desc id="d">With num_stages 1, each tile load must finish before its compute starts, so loads and compute alternate. With num_stages 3, the next tiles load while the current one computes, and the loop finishes in a little over half the time.</desc>
  <style>
    /* Granite tokens (light, then dark) */
    svg { --background:oklch(0.97 0.005 106); --muted:oklch(0.945 0.005 106);
          --border:oklch(0.9 0.005 106); --foreground:oklch(0.24 0.005 106); --ink-2:oklch(0.42 0.005 106);
          --muted-foreground:oklch(0.5 0.005 106); --brand:oklch(0.46 0.032 240);
          --chart-2:oklch(0.82 0.04 244.9); --on-fill:oklch(1 0.005 106); }
    @media (prefers-color-scheme: dark) {
      svg { --background:oklch(0.208 0.013 86); --muted:oklch(0.3 0.013 86);
            --border:oklch(0.94 0.013 86 / 12%); --foreground:oklch(0.94 0.013 86); --ink-2:oklch(0.8 0.013 86);
            --muted-foreground:oklch(0.94 0.013 86 / 60%); --brand:oklch(0.78 0.035 240);
            --chart-2:oklch(0.46 0.05 252.8); --on-fill:oklch(0.208 0.013 86); }
    }
    text { font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size:14px; fill:var(--foreground); }
    .frame { fill:var(--background); stroke:var(--border); }
    .ink-2 { fill:var(--ink-2); }
    .meta { font-size:12px; fill:var(--muted-foreground); }
    .mono, .mono text { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
    .eyebrow { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:11px; font-weight:500; letter-spacing:.12em; fill:var(--muted-foreground); }
    .lane { fill:var(--muted); }
    .load { fill:var(--chart-2); }
    .comp { fill:var(--foreground); stroke:var(--muted); stroke-width:3; }
    .on { fill:var(--on-fill); font-weight:500; }
    .end { stroke:var(--brand); stroke-width:1.5; }
    .axis { fill:none; stroke:var(--muted-foreground); marker-end:url(#tip); }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9" style="fill:none; stroke:var(--muted-foreground); stroke-width:1.5"/>
    </marker>
  </defs>
  <rect class="frame" x="0.5" y="0.5" width="839" height="379" rx="16"/>
  <!-- time scale: x = 140 + t; a load takes 80 units, a compute step 60 -->

  <!-- ===== num_stages = 1 ===== -->
  <text class="eyebrow" x="24" y="36">NUM_STAGES = 1 · WAIT FOR EACH TILE, THEN COMPUTE</text>
  <text class="ink-2" x="24" y="70">load</text>
  <text class="ink-2" x="24" y="110">compute</text>
  <rect class="lane" x="140" y="52" width="672" height="28" rx="6"/>
  <rect class="lane" x="140" y="92" width="672" height="28" rx="6"/>
  <g class="mono" text-anchor="middle">
    <rect class="load" x="140" y="54" width="80" height="24" rx="6"/><text x="180" y="70">load k0</text>
    <rect class="comp" x="220" y="93" width="60" height="26" rx="6"/><text class="on" x="250" y="110">k0</text>
    <rect class="load" x="280" y="54" width="80" height="24" rx="6"/><text x="320" y="70">load k1</text>
    <rect class="comp" x="360" y="93" width="60" height="26" rx="6"/><text class="on" x="390" y="110">k1</text>
    <rect class="load" x="420" y="54" width="80" height="24" rx="6"/><text x="460" y="70">load k2</text>
    <rect class="comp" x="500" y="93" width="60" height="26" rx="6"/><text class="on" x="530" y="110">k2</text>
    <rect class="load" x="560" y="54" width="80" height="24" rx="6"/><text x="600" y="70">load k3</text>
    <rect class="comp" x="640" y="93" width="60" height="26" rx="6"/><text class="on" x="670" y="110">k3</text>
  </g>
  <line class="end" x1="700" y1="46" x2="700" y2="128"/>
  <text x="708" y="144">done</text>
  <text class="meta" x="140" y="144">tensor cores idle during every load</text>

  <!-- ===== num_stages = 3 ===== -->
  <text class="eyebrow" x="24" y="196">NUM_STAGES = 3 · UP TO 2 TILES IN FLIGHT WHILE ONE COMPUTES</text>
  <text class="ink-2" x="24" y="232">load</text>
  <text class="ink-2" x="24" y="298">compute</text>
  <rect class="lane" x="140" y="210" width="672" height="56" rx="6"/>
  <rect class="lane" x="140" y="278" width="672" height="28" rx="6"/>
  <g class="mono" text-anchor="middle">
    <rect class="load" x="140" y="212" width="80" height="24" rx="6"/><text x="180" y="228">load k0</text>
    <rect class="load" x="160" y="240" width="80" height="24" rx="6"/><text x="200" y="256">load k1</text>
    <rect class="load" x="220" y="212" width="80" height="24" rx="6"/><text x="260" y="228">load k2</text>
    <rect class="load" x="280" y="240" width="80" height="24" rx="6"/><text x="320" y="256">load k3</text>
    <rect class="comp" x="220" y="279" width="60" height="26" rx="6"/><text class="on" x="250" y="296">k0</text>
    <rect class="comp" x="280" y="279" width="60" height="26" rx="6"/><text class="on" x="310" y="296">k1</text>
    <rect class="comp" x="340" y="279" width="60" height="26" rx="6"/><text class="on" x="370" y="296">k2</text>
    <rect class="comp" x="400" y="279" width="60" height="26" rx="6"/><text class="on" x="430" y="296">k3</text>
  </g>
  <line class="end" x1="460" y1="204" x2="460" y2="314"/>
  <text x="468" y="330">done</text>
  <text class="meta" x="500" y="232">each tile in flight holds one A tile</text>
  <text class="meta" x="500" y="250">and one B tile in shared memory</text>

  <path class="axis" d="M140,350 H806"/>
  <text class="meta" x="806" y="368" text-anchor="end">time</text>
</svg>
