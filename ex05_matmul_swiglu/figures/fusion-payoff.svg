<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-labelledby="t d">
  <title id="t">When fusion pays</title>
  <desc id="d">Each bar is the unfused cost on a T4, split into what fusion removes and what remains. At M = 4096, about 15 ms of GEMM compute remains and fusion removes about 2 ms of intermediate traffic, roughly 10 to 15 percent. At M = 16, reading the 235 MB of weights dominates and the 0.9 MB intermediate is under 1 percent.</desc>
  <style>
    /* Granite tokens (light, then dark) */
    svg { --background:oklch(0.97 0.005 106); --border:oklch(0.9 0.005 106); --foreground:oklch(0.24 0.005 106);
          --ink-2:oklch(0.42 0.005 106); --muted-foreground:oklch(0.5 0.005 106);
          --brand:oklch(0.46 0.032 240); --brand-muted:oklch(0.935 0.0096 240); --on-fill:oklch(1 0.005 106); }
    @media (prefers-color-scheme: dark) {
      svg { --background:oklch(0.208 0.013 86); --border:oklch(0.94 0.013 86 / 12%); --foreground:oklch(0.94 0.013 86);
            --ink-2:oklch(0.8 0.013 86); --muted-foreground:oklch(0.94 0.013 86 / 60%);
            --brand:oklch(0.78 0.035 240); --brand-muted:oklch(0.3 0.014 240); --on-fill:oklch(0.208 0.013 86); }
    }
    text { font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size:14px; fill:var(--foreground); }
    .frame { fill:var(--background); stroke:var(--border); }
    .title { font-weight:500; }
    .ink-2 { fill:var(--ink-2); }
    .meta { font-size:12px; fill:var(--muted-foreground); }
    .mono, .mono text { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
    .eyebrow { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:11px; font-weight:500; letter-spacing:.12em; fill:var(--muted-foreground); }
    .remain { fill:var(--foreground); }
    .removed { fill:var(--brand-muted); stroke:var(--brand); stroke-width:1.5; }
    .on { fill:var(--on-fill); font-size:13px; font-weight:500; }
    .leader { fill:none; stroke:var(--muted-foreground); }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="839" height="279" rx="16"/>
  <!-- each bar is 100% of its row's unfused cost; x = 180 .. 760 (580 px) -->

  <text class="eyebrow" x="24" y="36">UNFUSED COST, SPLIT BY WHAT FUSION REMOVES</text>

  <!-- M = 4096: 15 ms remains, 2 ms removed -> 2/17 = 12% -> 68 px -->
  <text class="title" x="24" y="80">M = 4096</text>
  <text class="meta" x="24" y="98">prefill</text>
  <rect class="remain" x="180" y="66" width="510" height="36" rx="6"/>
  <text class="on" x="194" y="89">GEMM compute, ~15 ms</text>
  <rect class="removed" x="692.75" y="66.75" width="66.5" height="34.5" rx="6"/>
  <text x="726" y="89" text-anchor="middle">~2 ms</text>
  <text class="meta" x="772" y="89">10-15%</text>

  <!-- M = 16: 235 MB of weights remain, 0.9 MB removed -> 0.4% -> 2 px, drawn 3 px -->
  <text class="title" x="24" y="152">M = 16</text>
  <text class="meta" x="24" y="170">decode</text>
  <rect class="remain" x="180" y="138" width="575" height="36" rx="6"/>
  <text class="on" x="194" y="161">weight reads, ~235 MB, ~0.8 ms</text>
  <rect class="removed" x="756.75" y="138.75" width="3" height="34.5" rx="1"/>
  <text class="meta" x="772" y="161">under 1%</text>
  <path class="leader" d="M758,178 V192"/>
  <text class="ink-2" x="760" y="208" text-anchor="end">intermediate, ~0.9 MB</text>

  <!-- legend -->
  <rect class="remain" x="180" y="232" width="14" height="14" rx="2"/>
  <text x="204" y="244">work that remains</text>
  <rect class="removed" x="370.75" y="232.75" width="12.5" height="12.5" rx="2"/>
  <text x="394" y="244">intermediate traffic fusion removes</text>
</svg>
