<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="t d">
  <title id="t">Unfused vs fused gate/up SwiGLU</title>
  <desc id="d">Unfused: a GEMM kernel reads x and W_cat from HBM and writes gu, shape M by 2F, back to HBM; a second kernel reads gu again and writes out. Fused: one kernel reads x and the weights, applies SiLU times up in its epilogue, and writes only out. gu never exists in memory.</desc>
  <style>
    /* Granite tokens (light, then dark) */
    svg { --background:oklch(0.97 0.005 106); --card:oklch(1 0.005 106); --muted:oklch(0.945 0.005 106);
          --border:oklch(0.9 0.005 106); --foreground:oklch(0.24 0.005 106); --ink-2:oklch(0.42 0.005 106);
          --muted-foreground:oklch(0.5 0.005 106); --brand:oklch(0.46 0.032 240); --brand-muted:oklch(0.935 0.0096 240);
          --on-fill:oklch(1 0.005 106); }
    @media (prefers-color-scheme: dark) {
      svg { --background:oklch(0.208 0.013 86); --card:oklch(0.24 0.013 86); --muted:oklch(0.3 0.013 86);
            --border:oklch(0.94 0.013 86 / 12%); --foreground:oklch(0.94 0.013 86); --ink-2:oklch(0.8 0.013 86);
            --muted-foreground:oklch(0.94 0.013 86 / 60%); --brand:oklch(0.78 0.035 240); --brand-muted:oklch(0.3 0.014 240);
            --on-fill:oklch(0.208 0.013 86); }
    }
    text { font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size:14px; fill:var(--foreground); }
    .frame { fill:var(--background); stroke:var(--border); }
    .ink-2 { fill:var(--ink-2); }
    .meta { font-size:12px; fill:var(--muted-foreground); }
    .mono, .mono text { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
    .eyebrow { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:11px; font-weight:500; letter-spacing:.12em; fill:var(--muted-foreground); }
    .lane { fill:var(--muted); }
    .tensor { fill:var(--card); stroke:var(--border); stroke-width:1.5; }
    .sel { fill:var(--brand-muted); stroke:var(--brand); stroke-width:1.5; }
    .gone { fill:none; stroke:var(--muted-foreground); stroke-dasharray:4 4; }
    .kernel { fill:var(--foreground); }
    .on { fill:var(--on-fill); font-weight:500; }
    .axis { fill:none; stroke:var(--muted-foreground); marker-end:url(#tip); }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9" style="fill:none; stroke:var(--muted-foreground); stroke-width:1.5"/>
    </marker>
  </defs>
  <rect class="frame" x="0.5" y="0.5" width="839" height="399" rx="16"/>

  <!-- ===== unfused ===== -->
  <text class="eyebrow" x="24" y="36">UNFUSED · TWO KERNELS</text>
  <text class="ink-2" x="24" y="79">kernels</text>
  <text class="ink-2" x="24" y="139">HBM</text>
  <rect class="lane" x="120" y="50" width="696" height="48" rx="6"/>
  <rect class="lane" x="120" y="110" width="696" height="48" rx="6"/>

  <rect class="tensor" x="130" y="114" width="120" height="40" rx="6"/>
  <g class="mono"><text x="140" y="130">x [M, K]</text><text x="140" y="146">W_cat [K, 2F]</text></g>
  <rect class="kernel" x="270" y="54" width="110" height="40" rx="6"/>
  <text class="on" x="325" y="79" text-anchor="middle">GEMM</text>
  <rect class="sel" x="390" y="114" width="140" height="40" rx="6"/>
  <text class="mono" x="460" y="138" text-anchor="middle">gu [M, 2F]</text>
  <rect class="kernel" x="560" y="54" width="120" height="40" rx="6"/>
  <text class="on" x="620" y="79" text-anchor="middle">SiLU(g) * u</text>
  <rect class="tensor" x="700" y="114" width="106" height="40" rx="6"/>
  <text class="mono" x="753" y="138" text-anchor="middle">out [M, F]</text>

  <path class="axis" d="M220,114 V74 H269"/>
  <path class="axis" d="M380,74 H430 V113"/>
  <path class="axis" d="M490,114 V74 H559"/>
  <path class="axis" d="M680,74 H740 V113"/>
  <text class="meta" x="424" y="92" text-anchor="end">write</text>
  <text class="meta" x="498" y="92">read</text>

  <text class="ink-2" x="390" y="180">Extra traffic: write gu, read it back.</text>
  <text class="mono ink-2" x="390" y="198">2 * M * 2F * 2 B, ~0.5 to 0.7 GB at M = 4096</text>

  <!-- ===== fused ===== -->
  <text class="eyebrow" x="24" y="246">FUSED · ONE KERNEL</text>
  <text class="ink-2" x="24" y="289">kernels</text>
  <text class="ink-2" x="24" y="349">HBM</text>
  <rect class="lane" x="120" y="260" width="696" height="48" rx="6"/>
  <rect class="lane" x="120" y="320" width="696" height="48" rx="6"/>

  <rect class="tensor" x="130" y="324" width="120" height="40" rx="6"/>
  <g class="mono"><text x="140" y="340">x [M, K]</text><text x="140" y="356">W_gate, W_up</text></g>
  <rect class="kernel" x="270" y="264" width="410" height="40" rx="6"/>
  <text class="on" x="475" y="289" text-anchor="middle">GEMM, then SiLU(acc_gate) * acc_up in the epilogue</text>
  <rect class="gone" x="390" y="324" width="140" height="40" rx="6"/>
  <text class="meta" x="460" y="348" text-anchor="middle">no gu in memory</text>
  <rect class="tensor" x="700" y="324" width="106" height="40" rx="6"/>
  <text class="mono" x="753" y="348" text-anchor="middle">out [M, F]</text>

  <path class="axis" d="M220,324 V284 H269"/>
  <path class="axis" d="M680,284 H740 V323"/>
  <text class="meta" x="120" y="388">Only out is written. Same FLOPs, one launch.</text>
</svg>
