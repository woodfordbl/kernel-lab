  <rect class="diag" x="230" y="220" width="60" height="60" rx="2"/>
  <rect class="skip" x="294" y="220" width="60" height="60" rx="2"/>
  <rect class="full" x="102" y="284" width="60" height="60" rx="2"/>
  <rect class="full" x="166" y="284" width="60" height="60" rx="2"/>
  <rect class="full" x="230" y="284" width="60" height="60" rx="2"/>
  <rect class="diag" x="294" y="284" width="60" height="60" rx="2"/>

  <!-- hi for query block 2 -->
  <path class="hi" d="M292,212 V288"/>
  <path class="guide" d="M292,290 V360"/>
  <text class="mono" x="292" y="376" text-anchor="middle">hi</text>
  <text class="meta" x="292" y="392" text-anchor="middle">where query block 2 stops</text>

  <!-- zoom guides -->
  <path class="guide" d="M292,218 L560,110 M292,282 L560,270"/>

  <!-- zoomed diagonal block: 8 x 8 elements -->
  <text class="eyebrow" x="560" y="82">DIAGONAL BLOCK 2, ZOOMED</text>
  <path class="axis" d="M560,100 H620"/><text class="meta" x="626" y="104">keys</text>
  <path class="axis" d="M546,110 V170"/><text class="meta" x="546" y="188" text-anchor="middle">q</text>
  <rect class="keep" x="560" y="110" width="20" height="20"/>
  <rect class="masked" x="580" y="110" width="20" height="20"/>
  <rect class="masked" x="600" y="110" width="20" height="20"/>
