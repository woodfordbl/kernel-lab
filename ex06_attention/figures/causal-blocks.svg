  <text x="584" y="306">key &lt;= query: keep s</text>
  <rect class="masked" x="560" y="318" width="14" height="14" rx="2" style="stroke:var(--border); stroke-width:1"/>
  <text x="584" y="330">key &gt; query: s = -inf</text>

  <!-- legend -->
  <rect class="full" x="40" y="428" width="14" height="14" rx="2"/>
  <text x="62" y="440">full: no mask (6)</text>
  <rect class="diag" x="210" y="428" width="14" height="14" rx="2"/>
  <text x="232" y="440">diagonal: per-element mask (4)</text>
  <rect class="skip" x="470" y="428" width="14" height="14" rx="2"/>
  <text x="492" y="440">skipped, beyond hi (6)</text>
  <text class="meta" x="40" y="462">10 of 16 blocks computed. As the number of blocks grows, this tends to half.</text>
</svg>
