  <rect class="masked" x="660" y="190" width="20" height="20"/>
  <rect class="masked" x="680" y="190" width="20" height="20"/>
  <rect class="masked" x="700" y="190" width="20" height="20"/>
  <rect class="keep" x="560" y="210" width="20" height="20"/>
  <rect class="keep" x="580" y="210" width="20" height="20"/>
  <rect class="keep" x="600" y="210" width="20" height="20"/>
