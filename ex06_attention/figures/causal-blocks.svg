<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="840" height="480" role="img" aria-labelledby="t d">
  <title id="t">Causal attention: which key blocks each query block visits</title>
  <desc id="d">A 4 by 4 grid of query blocks against key blocks. Blocks below the diagonal are full and need no mask. Diagonal blocks need a per-element mask. Blocks above the diagonal are skipped because the loop stops at hi. Zoomed in, a diagonal block keeps scores where key index is at most query index and sets the rest to minus infinity. 10 of the 16 blocks are computed.</desc>
  <style>
    /* Granite tokens (light, then dark) */
    svg { --background:oklch(0.97 0.005 106); --muted:oklch(0.945 0.005 106);
          --border:oklch(0.9 0.005 106); --foreground:oklch(0.24 0.005 106); --ink-2:oklch(0.42 0.005 106);
          --muted-foreground:oklch(0.5 0.005 106); --brand:oklch(0.46 0.032 240); --brand-muted:oklch(0.935 0.0096 240);
          --chart-3:oklch(0.79 0.045 152.8); }
    @media (prefers-color-scheme: dark) {
      svg { --background:oklch(0.208 0.013 86); --muted:oklch(0.3 0.013 86);
            --border:oklch(0.94 0.013 86 / 12%); --foreground:oklch(0.94 0.013 86); --ink-2:oklch(0.8 0.013 86);
            --muted-foreground:oklch(0.94 0.013 86 / 60%); --brand:oklch(0.78 0.035 240); --brand-muted:oklch(0.3 0.014 240);
            --chart-3:oklch(0.5 0.055 151); }
    }
    text { font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size:14px; fill:var(--foreground); }
    .frame { fill:var(--background); stroke:var(--border); }
    .ink-2 { fill:var(--ink-2); }
    .meta { font-size:12px; fill:var(--muted-foreground); }
    .mono, .mono text { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
    .eyebrow { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:11px; font-weight:500; letter-spacing:.12em; fill:var(--muted-foreground); }
    .full, .keep { fill:var(--chart-3); }
    .diag { fill:var(--brand-muted); stroke:var(--brand); stroke-width:1.5; }
    .skip { fill:var(--muted); stroke:var(--muted-foreground); stroke-dasharray:3 4; }
    .masked { fill:var(--muted); }
    .keep, .masked { stroke:var(--background); stroke-width:2; }
    .zoombox { fill:none; stroke:var(--brand); stroke-width:1.5; }
    .hi { stroke:var(--brand); stroke-width:2; }
    .guide { fill:none; stroke:var(--muted-foreground); stroke-dasharray:3 4; }
    .axis { fill:none; stroke:var(--muted-foreground); marker-end:url(#tip); }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9" style="fill:none; stroke:var(--muted-foreground); stroke-width:1.5"/>
    </marker>
  </defs>
  <rect class="frame" x="0.5" y="0.5" width="839" height="479" rx="16"/>

  <text class="eyebrow" x="40" y="40">CAUSAL · 4 QUERY BLOCKS x 4 KEY BLOCKS, BLOCK_M = BLOCK_N</text>

  <!-- block map: rows = query blocks, columns = key blocks -->
  <path class="axis" d="M100,56 H160"/><text class="meta" x="166" y="60">key blocks</text>
  <path class="axis" d="M58,90 V150"/><text class="meta" x="58" y="168" text-anchor="middle">query</text><text class="meta" x="58" y="184" text-anchor="middle">blocks</text>
  <g class="mono ink-2" text-anchor="middle">
    <text x="132" y="82">0</text>
    <text x="196" y="82">1</text>
    <text x="260" y="82">2</text>
    <text x="324" y="82">3</text>
    <text x="88" y="126">0</text>
    <text x="88" y="190">1</text>
    <text x="88" y="254">2</text>
    <text x="88" y="318">3</text>
  </g>
  <rect class="diag" x="102" y="92" width="60" height="60" rx="2"/>
  <rect class="skip" x="166" y="92" width="60" height="60" rx="2"/>
  <rect class="skip" x="230" y="92" width="60" height="60" rx="2"/>
  <rect class="skip" x="294" y="92" width="60" height="60" rx="2"/>
